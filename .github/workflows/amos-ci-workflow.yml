name: Amos / Workflow

on:
  workflow_call:

permissions:
  contents: read
  issues: write
  pull-requests: write


jobs:
  policy:
    name: Branch Protection
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      valid: ${{ steps.policy.outputs.valid }}
      pr_type: ${{ steps.policy.outputs.pr_type }}
    concurrency:
      group: amos-ci-policy-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      # No checkout of amos-ci needed here: this composite action lives in
      # amos-ci itself, and referencing it via `uses: owner/repo/path@ref`
      # makes the runner download that repo's content automatically (a
      # scoped, auto-expiring token GitHub issues for `uses:` references --
      # see README) rather than needing a PAT once amos-ci is private.
      - name: Evaluate Git policy
        id: policy
        uses: bentideswell/amos-ci/.github/actions/evaluate-policy@main
        with:
          head_ref: ${{ github.head_ref }}
          base_ref: ${{ github.base_ref }}

      - name: Check branch freshness / promotion safety
        id: freshness
        if: steps.policy.outputs.valid == 'true' && steps.policy.outputs.freshness_mode != 'none'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          MODE: ${{ steps.policy.outputs.freshness_mode }}
        run: |
          set -euo pipefail

          # GitHub's compare API returns:
          # - "behind"    when HEAD is behind BASE
          # - "ahead"     when HEAD contains BASE and has additional commits
          # - "identical" when both point at the same commit
          # - "diverged"  when each side has commits the other side lacks
          #
          # We compare BASE...HEAD. For the checks below, BASE must be fully
          # contained in HEAD. This is safe for topic/hotfix PRs and also
          # prevents promotion over an un-backported hotfix.

          comparison="$(
            gh api \
              "repos/$GH_REPO/compare/$BASE_REF...$HEAD_REF" \
              --jq '{status: .status, ahead_by: .ahead_by, behind_by: .behind_by}'
          )"

          status="$(jq -r '.status' <<<"$comparison")"
          ahead_by="$(jq -r '.ahead_by' <<<"$comparison")"
          behind_by="$(jq -r '.behind_by' <<<"$comparison")"

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "ahead_by=$ahead_by" >> "$GITHUB_OUTPUT"
          echo "behind_by=$behind_by" >> "$GITHUB_OUTPUT"

          case "$status" in
            ahead|identical)
              echo "safe=true" >> "$GITHUB_OUTPUT"
              ;;

            behind|diverged)
              echo "safe=false" >> "$GITHUB_OUTPUT"

              if [[ "$MODE" == "source-must-contain-target" ]]; then
                echo "::error::The source branch does not contain the latest $BASE_REF. Update $HEAD_REF from $BASE_REF before merging."
              else
                echo "::error::$BASE_REF contains commits that are not present in $HEAD_REF. Backport/cascade those changes first; do not merge $HEAD_REF into $BASE_REF yet."
              fi

              exit 1
              ;;

            *)
              echo "::error::Unexpected compare status: $status"
              exit 1
              ;;
          esac

      - name: Build policy summary
        if: always()
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          VALID: ${{ steps.policy.outputs.valid }}
          PR_TYPE: ${{ steps.policy.outputs.pr_type }}
          MERGE_METHOD: ${{ steps.policy.outputs.merge_method }}
          FRESHNESS_MODE: ${{ steps.policy.outputs.freshness_mode }}
          REASON: ${{ steps.policy.outputs.reason }}
          FRESHNESS_STATUS: ${{ steps.freshness.outputs.status }}
        run: |
          set -euo pipefail

          {
            echo "## Amos Git Policy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Source | \`$HEAD_REF\` |"
            echo "| Target | \`$BASE_REF\` |"

            if [[ "$VALID" != "true" ]]; then
              echo "| Result | **INVALID** |"
              echo
              echo "❌ $REASON"
              exit 0
            fi

            echo "| PR type | $PR_TYPE |"

            if [[ "$MERGE_METHOD" == "squash" ]]; then
              echo "| Required merge method | **SQUASH** |"
            else
              echo "| Required merge method | **MERGE COMMIT** |"
            fi

            case "$FRESHNESS_MODE" in
              source-must-contain-target)
                if [[ "$FRESHNESS_STATUS" == "ahead" || "$FRESHNESS_STATUS" == "identical" ]]; then
                  echo "| Branch freshness | ✅ Source contains latest target |"
                else
                  echo "| Branch freshness | ❌ Source is not based on latest target |"
                fi
                ;;

              target-contained-in-source)
                if [[ "$FRESHNESS_STATUS" == "ahead" || "$FRESHNESS_STATUS" == "identical" ]]; then
                  echo "| Promotion safety | ✅ Target has no un-backported commits |"
                else
                  echo "| Promotion safety | ❌ Target contains commits missing from source |"
                fi
                ;;

              none)
                echo "| Branch freshness | Not required for this backport/cascade |"
                ;;
            esac

            echo
            echo "✅ Branch name and PR direction comply with the Amos workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure policy labels exist
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "merge:squash" \
            --repo "$GH_REPO" \
            --description "This PR must use Squash and merge" \
            --color "1D76DB" \
            --force

          gh label create "merge:merge-commit" \
            --repo "$GH_REPO" \
            --description "This PR must use Create a merge commit" \
            --color "5319E7" \
            --force

      - name: Apply merge-method label
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALID: ${{ steps.policy.outputs.valid }}
          REQUIRED_LABEL: ${{ steps.policy.outputs.label }}
        run: |
          set -euo pipefail

          gh pr edit "$PR_NUMBER" --remove-label "merge:squash" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --remove-label "merge:merge-commit" 2>/dev/null || true

          if [[ "$VALID" == "true" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "$REQUIRED_LABEL"
          fi

      - name: Enable auto-merge
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALID: ${{ steps.policy.outputs.valid }}
          MERGE_METHOD: ${{ steps.policy.outputs.merge_method }}
        run: |
          set -euo pipefail

          if [[ "$VALID" != "true" ]]; then
            exit 0
          fi

          # Arms GitHub's native auto-merge with the method this PR type
          # requires (squash for topic branches, merge commit for
          # promotions/backports/cascades), so a compliant PR merges itself
          # the moment every required check reports passing -- nobody has to
          # remember to pick the right button. This re-runs on every push, so
          # it's harmless to call again if auto-merge is already enabled.
          #
          # If a required check has already failed by the time this runs,
          # GitHub refuses to arm auto-merge at all (it errors rather than
          # arming-and-waiting) -- that failure here is an expected, non-fatal
          # outcome, not a bug: it just means this PR needs a normal manual
          # merge once it's fixed, same as before this step existed.
          #
          # No --delete-branch: tried it, didn't work -- the repo's
          # delete_branch_on_merge setting (and this flag) don't reliably
          # clean up after a merge performed by a bot/app token (this one
          # runs as github-actions[bot], via GITHUB_TOKEN), the same
          # GITHUB_TOKEN-vs-human distinction that already ruled out a
          # pull_request:closed cleanup job -- see README. Branch deletion
          # is a manual "Delete branch" click for now; the only reliable
          # automated fix is a scheduled job that sweeps merged PRs
          # directly, judged not worth the added complexity for now.
          merge_output="$(gh pr merge "$PR_NUMBER" --auto --"$MERGE_METHOD" 2>&1)" && merge_status=0 || merge_status=$?

          if [[ $merge_status -ne 0 ]]; then
            # Arming auto-merge can fail for the expected, benign reason
            # above (a required check already failed) -- but it can also
            # fail for a reason that deserves attention (a transient API
            # error, a permissions problem, auto-merge disabled at the repo
            # level). Surface every failure as a visible warning instead of
            # discarding it silently, so a PR left needing a manual merge
            # doesn't sit with no signal anywhere that auto-merge never
            # armed.
            echo "::warning::Failed to arm auto-merge for PR #$PR_NUMBER: $merge_output"
          fi

      - name: Set PR title/body for Promotion/Backport/Cascade PRs
        if: github.event.action == 'opened' && steps.policy.outputs.valid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TYPE: ${{ steps.policy.outputs.pr_type }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Same "applicable" split as check-pr-content.sh: these PR types
          # require the template's sections filled in, so leave title/body
          # alone -- this step only touches Promotion/Backport/Cascade.
          case "$PR_TYPE" in
            Feature|Bugfix|Chore|Hotfix) exit 0 ;;
          esac

          # A Promotion/Backport/Cascade PR moves already-described commits
          # between branches -- there's nothing new to describe, and
          # check-pr-content.sh already exempts these PR types from needing
          # the template filled in. Rather than try to detect and strip
          # whatever GitHub auto-filled (a single commit's message when
          # there's exactly one commit, plus the repo's PR template
          # unconditionally appended underneath it), just replace both
          # outright with a short, predictable title and a plain-English
          # body.
          #
          # A commit count was tried in the body and dropped: `gh pr view
          # --json commits` didn't reliably reflect the real branch diff
          # (seen returning 1, and even the PR title showing 5, when
          # uat..dev was actually 0 commits at the time) -- not worth
          # chasing given nothing downstream depends on the number.
          case "$PR_TYPE" in
            Promotion)        type_word="promote" ;;
            Backport)         type_word="backport" ;;
            Cascade/backport) type_word="cascade" ;;
          esac

          gh pr edit "$PR_NUMBER" \
            --title "$type_word: $HEAD_REF -> $BASE_REF" \
            --body "This is a $PR_TYPE pull request merging $HEAD_REF into $BASE_REF."
          echo "Set PR title/body for this $PR_TYPE PR."

      - name: Create or update policy comment
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          VALID: ${{ steps.policy.outputs.valid }}
          PR_TYPE: ${{ steps.policy.outputs.pr_type }}
          MERGE_METHOD: ${{ steps.policy.outputs.merge_method }}
          FRESHNESS_MODE: ${{ steps.policy.outputs.freshness_mode }}
          FRESHNESS_STATUS: ${{ steps.freshness.outputs.status }}
          REASON: ${{ steps.policy.outputs.reason }}
        run: |
          set -euo pipefail

          marker='<!-- amos-git-policy -->'
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          {
            echo "$marker"
            echo "## Amos Git Policy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Source | \`$HEAD_REF\` |"
            echo "| Target | \`$BASE_REF\` |"

            if [[ "$VALID" != "true" ]]; then
              echo "| Result | **INVALID** |"
              echo
              echo "❌ **This PR does not follow the branching policy and cannot be merged.**"
              echo
              echo "$REASON"
            else
              echo "| PR type | $PR_TYPE |"

              if [[ "$MERGE_METHOD" == "squash" ]]; then
                echo "| Required merge method | **SQUASH** |"
              else
                echo "| Required merge method | **MERGE COMMIT** |"
              fi

              case "$FRESHNESS_MODE" in
                source-must-contain-target)
                  if [[ "$FRESHNESS_STATUS" == "ahead" || "$FRESHNESS_STATUS" == "identical" ]]; then
                    echo "| Branch freshness | ✅ Up to date |"
                  else
                    echo "| Branch freshness | ❌ Source does not contain latest target |"
                  fi
                  ;;
                target-contained-in-source)
                  if [[ "$FRESHNESS_STATUS" == "ahead" || "$FRESHNESS_STATUS" == "identical" ]]; then
                    echo "| Promotion safety | ✅ No un-backported target commits |"
                  else
                    echo "| Promotion safety | ❌ Target has commits missing from source |"
                  fi
                  ;;
                none)
                  echo "| Branch freshness | Not required for this backport/cascade |"
                  ;;
              esac

              echo

              if [[ "$FRESHNESS_MODE" == "source-must-contain-target" ]] && \
                 [[ "$FRESHNESS_STATUS" != "ahead" && "$FRESHNESS_STATUS" != "identical" ]]; then
                echo "❌ **This PR is not ready to merge.**"
                echo
                echo "Update \`$HEAD_REF\` from \`$BASE_REF\`, then push the updated source branch."
              elif [[ "$FRESHNESS_MODE" == "target-contained-in-source" ]] && \
                   [[ "$FRESHNESS_STATUS" != "ahead" && "$FRESHNESS_STATUS" != "identical" ]]; then
                echo "❌ **This promotion is not ready to merge.**"
                echo
                echo "\`$BASE_REF\` contains commits that are not present in \`$HEAD_REF\`. Complete the required backport/cascade first."
                echo
                echo "> Do **not** merge \`$BASE_REF\` into \`$HEAD_REF\` merely to satisfy this check."
              else
                echo "✅ This PR follows the branching policy."

                if [[ "$MERGE_METHOD" == "squash" ]]; then
                  echo
                  echo "> **When merging, use _Squash and merge_. Do not create a merge commit.**"
                else
                  echo
                  echo "> **When merging, use _Create a merge commit_. Do not squash this PR.**"
                fi
              fi
            fi

            echo
            echo "_This comment is maintained automatically by the Amos Git Policy workflow._"
          } > "$body_file"

          comment_id="$(
            gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100" \
              --paginate \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" \
              | head -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            gh api \
              --method PATCH \
              "repos/$GH_REPO/issues/comments/$comment_id" \
              --raw-field "body=$(cat "$body_file")" \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              --raw-field "body=$(cat "$body_file")" \
              >/dev/null
          fi

      - name: Enforce PR direction
        if: steps.policy.outputs.valid != 'true'
        shell: bash
        env:
          REASON: ${{ steps.policy.outputs.reason }}
        run: |
          echo "::error::$REASON"
          exit 1

  pr-content:
    name: PR Content
    if: github.event.action != 'closed'
    needs: policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: amos-ci-pr-content-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      # Fetches title/body separately from validating them (below), because
      # the validation itself now runs as a cross-repo composite action --
      # see evaluate-policy's comment above for why -- and its inputs must
      # be passed as step outputs, not produced inline in the same step.
      - name: Fetch current PR title/body
        id: pr
        if: needs.policy.outputs.valid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Fetch the PR's CURRENT title/body live rather than reading
          # github.event.pull_request.title/body -- that's a frozen snapshot
          # of the webhook payload from when the PR was opened, and doesn't
          # reflect the "policy" job's own "Set PR title/body" step, which
          # runs earlier in the same workflow run and rewrites both for
          # Promotion/Backport/Cascade PRs. Validating against the stale
          # snapshot meant those PRs always failed here, even though the
          # PR itself was already correct by the time this step ran.
          title="$(gh pr view "$PR_NUMBER" --json title --jq '.title')"
          body="$(gh pr view "$PR_NUMBER" --json body --jq '.body')"

          # A random per-run delimiter, not a fixed one like "EOF" -- a PR
          # body that happens to contain a line matching a fixed delimiter
          # would otherwise corrupt this multiline $GITHUB_OUTPUT write.
          delim="pr_content_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "title<<$delim"
            printf '%s\n' "$title"
            echo "$delim"
            echo "body<<$delim"
            printf '%s\n' "$body"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      # title/body are passed as `with:` inputs, which the action turns into
      # env vars internally (see check-pr-content/action.yml) rather than
      # interpolating into a run: script -- they're untrusted, author-
      # controlled text, so this keeps them data, never shell syntax.
      - name: Validate PR content
        id: content
        if: needs.policy.outputs.valid == 'true'
        uses: bentideswell/amos-ci/.github/actions/check-pr-content@main
        with:
          pr_type: ${{ needs.policy.outputs.pr_type }}
          title: ${{ steps.pr.outputs.title }}
          body: ${{ steps.pr.outputs.body }}

      - name: Ensure client-facing label exists
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "client-facing" \
            --repo "$GH_REPO" \
            --description "A client would notice this change — surfaced in the client release notes" \
            --color "0E8A16" \
            --force

      - name: Apply client-facing label
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUIRED: ${{ steps.content.outputs.client_facing_required }}
        run: |
          set -euo pipefail

          if [[ "$REQUIRED" == "true" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "client-facing"
          else
            gh pr edit "$PR_NUMBER" --remove-label "client-facing" 2>/dev/null || true
          fi

      - name: Comment on PR content status
        if: needs.policy.outputs.valid == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CONTENT_VALID: ${{ steps.content.outputs.valid }}
          REASONS: ${{ steps.content.outputs.reasons }}
        run: |
          set -euo pipefail

          marker='<!-- amos-pr-content -->'

          comment_id="$(
            gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100" \
              --paginate \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" \
              | head -n 1
          )"

          # No prior marker comment and content is fine: nothing to say, and
          # nothing to clean up. Skip the API calls entirely on this (the
          # common) path.
          if [[ "$CONTENT_VALID" == "true" && -z "$comment_id" ]]; then
            exit 0
          fi

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          if [[ "$CONTENT_VALID" != "true" ]]; then
            {
              echo "$marker"
              echo "## Amos PR Content"
              echo
              echo "❌ **This PR is missing required content and cannot be merged.**"
              echo
              IFS=';' read -ra items <<< "$REASONS"
              for item in "${items[@]}"; do
                trimmed="$(echo "$item" | xargs)"
                [[ -n "$trimmed" ]] && echo "- $trimmed"
              done
              echo
              echo "See \`pull_request_template.md\` for the required sections."
              echo
              echo "_This comment is maintained automatically by the Amos PR Content workflow._"
            } > "$body_file"
          else
            # Content was previously invalid (a marker comment exists) and has
            # since been fixed. Update that comment in place rather than
            # leaving a stale "cannot be merged" message on a PR that's now
            # compliant.
            {
              echo "$marker"
              echo "## Amos PR Content"
              echo
              echo "✅ **This PR's required content is now complete.**"
              echo
              echo "_This comment is maintained automatically by the Amos PR Content workflow._"
            } > "$body_file"
          fi

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" \
              --raw-field "body=$(cat "$body_file")" >/dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              --raw-field "body=$(cat "$body_file")" >/dev/null
          fi

      - name: Fail on missing PR content
        if: needs.policy.outputs.valid == 'true' && steps.content.outputs.valid != 'true'
        env:
          REASONS: ${{ steps.content.outputs.reasons }}
        run: |
          echo "::error::PR content requirements not met: $REASONS"
          exit 1
